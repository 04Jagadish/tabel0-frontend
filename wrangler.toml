name = "tabelo-frontend"
main = "index.js"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false
keep_vars = true

# Add your Access-protected custom domain before deploying.
# [[routes]]
# pattern = "app.example.com"
# custom_domain = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
